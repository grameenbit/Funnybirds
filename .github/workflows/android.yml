name: Android Build
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "--- SDK dir ---"
          ls "$SDK_ROOT" || true
          echo "--- build-tools ---"
          ls "$SDK_ROOT/build-tools" || true
          echo "--- platforms ---"
          ls "$SDK_ROOT/platforms" || true
      - name: Install build-tools & Pillow
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" >/dev/null 2>&1 || true
          echo "$(ls -d $SDK_ROOT/build-tools/*/ | head -1)" >> $GITHUB_PATH
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil imagemagick || pip3 install --quiet Pillow || true
      - name: Grant execute permission for build.sh
        run: chmod +x android-apk/build.sh || true
      - name: Build APK (shell build)
        working-directory: android-apk
        run: bash build.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            android-apk/*.apk
            android-apk/**/*.apk
          if-no-files-found: warn
